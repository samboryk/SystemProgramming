<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#030509"/>
    </linearGradient>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)" stroke="url(#primaryGlow)" stroke-width="12"/>

  <!-- Inner Tech Border Accent -->
  <rect x="44" y="44" width="424" height="424" rx="80" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.25"/>

  <!-- Code Prompt > -->
  <path d="M 112 168 L 224 256 L 112 344" fill="none" stroke="url(#primaryGlow)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Cursor / Underline _ -->
  <line x1="256" y1="344" x2="400" y2="344" stroke="url(#accentGlow)" stroke-width="36" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Stylized "S" Tech Logo Emblem in Top Right -->
  <circle cx="376" cy="152" r="34" fill="#1e3a8a" opacity="0.4"/>
  <path d="M 386 140 C 386 132, 366 132, 366 144 C 366 158, 386 154, 386 168 C 386 178, 366 178, 366 170" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round"/>
</svg>
